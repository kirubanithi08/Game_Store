# -----------------------------
# App Name
# -----------------------------
spring.application.name=GameStore

# -----------------------------
# PostgreSQL Database Configuration (Render)
# -----------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Show SQL in console
spring.jpa.show-sql=true

# Automatically update schema
spring.jpa.hibernate.ddl-auto=update

# -----------------------------
# H2 Console DISABLED (not used in production)
# -----------------------------
spring.h2.console.enabled=false

# Use a 256-bit (or larger) random secret encoded in Base64.
# Generate one locally (example commands below) and paste it here.
jwt.secret=REPLACE_WITH_YOUR_BASE64_256_BIT_SECRET

