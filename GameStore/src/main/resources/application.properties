# -----------------------------
# App Name
# -----------------------------
spring.application.name=GameStore

# -----------------------------
# H2 Database Configuration
# -----------------------------
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Show SQL in console
spring.jpa.show-sql=true

# Automatically update schema (keeps data until app restarts)
spring.jpa.hibernate.ddl-auto=update
# For development only you may use:
# spring.jpa.hibernate.ddl-auto=create-drop

# -----------------------------
# H2 Console (Browser UI)
# -----------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Allow H2 console frame (Spring Security blocks frames by default)
spring.h2.console.settings.web-allow-others=true

# Fix H2 console frame issues
server.error.whitelabel.enabled=false
